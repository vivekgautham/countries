name: Scheduled Data Updates

on:
  schedule:
    # Run at 00:00 UTC on the 1st day of every month
    - cron: "0 0 1 * *"
  workflow_dispatch: # Allows manual one-click trigger in GitHub Actions UI

permissions:
  contents: write

jobs:
  update-datasets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Update GDP and Airport Datasets
        run: |
          npm run update:gdp
          npm run update:airports

      - name: Format files
        run: npm run format

      - name: Commit and push changes if data updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/gdp.json src/data/airports.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): automated monthly dataset refresh"
            git push origin main
          else
            echo "No data changes detected. Everything is up to date."
          fi
